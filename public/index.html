<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f8fafc">
<title>Smart Lost & Found</title><meta name="app-version" content="v23">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* ===== Dynamic 3D Light Theme =====
   Theme variables are written to :root by applyTheme() in the script. The values below are the default (no university) theme.
   --theme-primary / --theme-secondary / --theme-gradient : the brand colours (primary becomes a gradient for "Others")
   --theme-btn / --theme-btn-dark / --theme-btn-rgb       : primary darkened until white text passes 4.5:1 contrast
   --theme-btn-bg / --theme-title / --theme-conic         : ready-made backgrounds built from the colours above */
:root{--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;
--theme-primary:#4f46e5;--theme-secondary:#0ea5e9;--theme-gradient:linear-gradient(90deg,#4f46e5,#0ea5e9);
--theme-btn:#4f46e5;--theme-btn-dark:#3d36b6;--theme-btn-rgb:79,70,229;--theme-solid:#4f46e5;
--theme-btn-bg:linear-gradient(135deg,#4f46e5,#3d36b6);--theme-title:linear-gradient(90deg,#4f46e5,#3d36b6);
--theme-conic:conic-gradient(from 0deg,#4f46e5,#0ea5e9,#3d36b6,#4f46e5);
--b1:79,70,229;--b2:14,165,233;--b3:79,70,229;
--lost:#e11d48;--found:#059669;
--shadow-1:0 10px 30px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.03);
--shadow-2:0 24px 48px -14px rgba(15,23,42,.18),0 6px 14px rgba(15,23,42,.06)}
*{box-sizing:border-box}
html{height:100%;background:#f8fafc}
html,body{margin:0}
body{height:100%;background:radial-gradient(1100px 560px at 8% -8%,rgba(var(--b1),.09),transparent 62%),radial-gradient(900px 520px at 100% 108%,rgba(var(--b2),.09),transparent 60%),#f8fafc;color:var(--ink);font:500 15px/1.5 'Plus Jakarta Sans',Inter,system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;padding-top:env(safe-area-inset-top,0)}
button,input,select,textarea{font-family:inherit}
#app{position:relative;z-index:1;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0)}

/* Living background: soft colour fields and outlined shapes that drift slowly, tinted by the theme */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg span{position:absolute;border-radius:50%;will-change:transform}
.bg .o1{width:560px;height:560px;left:-180px;top:-120px;background:radial-gradient(circle,rgba(var(--b1),.30),transparent 68%);animation:drift1 26s ease-in-out infinite alternate}
.bg .o2{width:620px;height:620px;right:-220px;top:28%;background:radial-gradient(circle,rgba(var(--b2),.26),transparent 68%);animation:drift2 32s ease-in-out infinite alternate}
.bg .o3{width:480px;height:480px;left:18%;bottom:-220px;background:radial-gradient(circle,rgba(var(--b3),.20),transparent 68%);animation:drift3 29s ease-in-out infinite alternate}
.bg i{position:absolute;display:block;will-change:transform}
.bg .s1{width:150px;height:150px;right:12%;top:10%;border-radius:34px;border:1.5px solid rgba(var(--b1),.22);animation:spinslow 46s linear infinite}
.bg .s2{width:96px;height:96px;left:7%;bottom:16%;border-radius:50%;border:1.5px solid rgba(var(--b2),.28);animation:drift2 24s ease-in-out infinite alternate-reverse}
.bg .s3{width:70px;height:70px;left:46%;top:58%;border-radius:20px;border:1.5px solid rgba(var(--b3),.20);animation:spinslow 60s linear infinite reverse}
@keyframes drift1{to{transform:translate3d(120px,90px,0) scale(1.12)}}
@keyframes drift2{to{transform:translate3d(-110px,-70px,0) scale(1.1)}}
@keyframes drift3{to{transform:translate3d(90px,-100px,0) scale(1.15)}}
@keyframes spinslow{to{transform:rotate(360deg) translate3d(14px,-10px,0)}}

/* Header */
header{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px 14px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 20px -10px rgba(15,23,42,.12)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--theme-gradient);background-size:300% 100%}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer;font:inherit}
.who>div{min-width:0}
.who b{display:block;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mute);font-size:12px}
.uni{margin-left:auto;flex:none;display:flex;align-items:center;height:46px;padding:5px;border-radius:999px;border:1px solid rgba(var(--theme-btn-rgb),.35);background:#fff;box-shadow:0 0 0 1px rgba(var(--theme-btn-rgb),.05),0 6px 18px -4px rgba(var(--theme-btn-rgb),.45);animation:glow 4.5s ease-in-out infinite}
.uni img{display:block;height:34px;width:34px;border-radius:50%;background:#fff;object-fit:contain;padding:3px;border:1px solid var(--line)}
.uni .mono{height:34px;min-width:34px;padding:0 8px;border-radius:999px;background:rgba(var(--theme-btn-rgb),.12);color:var(--theme-btn);display:grid;place-items:center;font-weight:800;font-size:12px}
.uni-name{display:none;font-size:12px;font-weight:700;padding:0 10px 0 8px;color:#334155;white-space:nowrap}
.signup-top{position:relative}.signup-uni{position:absolute;right:0;top:0}.signup-top .uni-name{display:none!important}
@media(min-width:600px){.uni-name{display:block}}
@keyframes glow{50%{box-shadow:0 0 0 1px rgba(var(--theme-btn-rgb),.1),0 10px 26px -4px rgba(var(--theme-btn-rgb),.62)}}

/* Avatar */
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:var(--theme-btn-bg);border:2px solid #fff;box-shadow:0 4px 12px -2px rgba(var(--theme-btn-rgb),.45)}
.av.lg{width:72px;height:72px;font-size:26px}
.av.xl{width:104px;height:104px;font-size:38px}

/* Profile summary */
.pcard{padding:16px}
.pactions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.ringav{position:relative;width:112px;height:112px;margin:10px auto 14px;border-radius:50%;display:grid;place-items:center}
.ringav::before{content:"";position:absolute;inset:-7px;border-radius:50%;background:var(--theme-conic);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:spin 7s linear infinite}
.ringav::after{content:"";position:absolute;inset:-7px;border-radius:50%;box-shadow:0 0 22px rgba(var(--theme-btn-rgb),.4);animation:glowp 3.6s ease-in-out infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glowp{50%{box-shadow:0 0 36px rgba(var(--theme-btn-rgb),.7)}}
.pname{text-align:center;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;word-break:break-word}
.pbadges{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.tag.ubadge{background:#fff;color:#334155;border-color:var(--line);box-shadow:0 2px 6px rgba(15,23,42,.05)}
.pgrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:18px}
.pitem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;box-shadow:0 2px 8px rgba(15,23,42,.04)}
.pitem small{display:block;color:var(--mute);font-size:12px;font-weight:700;margin-bottom:2px}
.pitem b{display:block;font-weight:700;word-break:break-word}
.pitem a,.party a,.proof a{color:var(--theme-btn);text-decoration:none;font-weight:700}
.pcard .stats{margin-top:0}

/* Type + logo */
.biglogo{width:130px;height:130px;object-fit:contain;display:block;margin:0 auto 4px;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(var(--theme-btn-rgb),.3))}
@keyframes bob{50%{transform:translateY(-6px)}}
h2{font-size:21px;font-weight:800;margin:6px 2px 10px;letter-spacing:-.01em}
h3{font-size:13px;color:var(--mute);margin:18px 2px 8px;font-weight:700}
main{flex:1;overflow-y:auto;padding:14px 14px 22px}

/* Bottom nav */
nav{display:flex;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 -8px 24px -12px rgba(15,23,42,.14)}
nav button{position:relative;flex:1;padding:11px 2px 9px;border:0;background:none;color:var(--mute);font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:color .2s}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s ease}
nav button.on{color:var(--theme-btn)}
nav button.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 4px 4px;background:var(--theme-gradient);background-size:300% 100%}
nav button.on svg{transform:translateY(-2px);filter:drop-shadow(0 3px 5px rgba(var(--theme-btn-rgb),.55))}
button:focus-visible,.who:focus-visible{outline:2px solid var(--theme-btn);outline-offset:2px}

/* 3D cards */
.card{position:relative;background:#fff;border:1px solid rgba(15,23,42,.06);border-radius:18px;padding:14px;box-shadow:var(--shadow-1),inset 0 1px 0 #fff;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease}
.card.nf{overflow:hidden}
.card.nf::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--theme-gradient);background-size:300% 100%}
.tilt{margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}.mute{color:var(--mute);font-size:13px}
@media (hover:hover){
 .tilt:hover{transform:translateY(-4px) scale(1.01);box-shadow:var(--shadow-2)}
 .fc.tilt:hover{transform:translateY(-4px) scale(1.01)}
 .fc.tilt:hover .face.card{box-shadow:var(--shadow-2)}
}
.rv{opacity:0}
.rv.in{opacity:1;animation:rise .55s cubic-bezier(.2,.8,.2,1) var(--rd,0s) backwards}
.rv.in.still{animation:none}
@keyframes rise{from{opacity:0;translate:0 18px}}

/* Empty + loading placeholders */
.empty{text-align:center;color:var(--mute);padding:26px 14px}
.empty p{margin:0}
.orb{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),var(--theme-btn) 55%,rgba(var(--theme-btn-rgb),.2));box-shadow:0 0 0 0 rgba(var(--theme-btn-rgb),.45),0 10px 22px -6px rgba(var(--theme-btn-rgb),.5);animation:ping 2.8s ease-out infinite,bob 5s ease-in-out infinite}
@keyframes ping{to{box-shadow:0 0 0 24px rgba(var(--theme-btn-rgb),0),0 10px 22px -6px rgba(var(--theme-btn-rgb),.5)}}
.skel{margin-bottom:14px}
.skel i{display:block;height:11px;border-radius:6px;background:rgba(15,23,42,.07);margin:7px 0;animation:pulse 1.7s ease-in-out infinite}
.skel .ico{animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* Forms */
.reveal-in{animation:revealIn .25s ease}
@keyframes revealIn{from{opacity:0;transform:translateY(-6px)}}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px;color:#334155}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:var(--ink);font:inherit;box-shadow:inset 0 1px 2px rgba(15,23,42,.05)}
input::placeholder,textarea::placeholder{color:#94a3b8}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--theme-btn);box-shadow:0 0 0 3px rgba(var(--theme-btn-rgb),.18)}
input[type=file]{padding:8px}
input[type=file]::file-selector-button{margin-right:10px;padding:6px 12px;border:1px solid rgba(var(--theme-btn-rgb),.3);border-radius:8px;background:rgba(var(--theme-btn-rgb),.08);color:var(--theme-btn);font:inherit;font-weight:700;cursor:pointer}
.btn{width:100%;padding:13px;border:0;border-radius:14px;color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:14px;background:var(--theme-btn-bg);box-shadow:0 10px 20px -8px rgba(var(--theme-btn-rgb),.6),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.14);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease}
.btn:hover{transform:translateY(-3px) scale(1.01);box-shadow:0 18px 28px -10px rgba(var(--theme-btn-rgb),.7),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.14)}
.btn:active{transform:translateY(0) scale(.99)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.sm{width:auto;padding:8px 14px;margin:0;font-size:13px}
.btn.alt{background:#fff;color:var(--theme-btn);border:1px solid var(--line);box-shadow:0 4px 10px -4px rgba(15,23,42,.14),inset 0 -2px 0 rgba(15,23,42,.04)}
.btn.alt:hover{box-shadow:0 14px 24px -10px rgba(15,23,42,.24),inset 0 -2px 0 rgba(15,23,42,.04)}
.btn.bad{background:#fff;color:#be123c;border:1px solid #fda4af;box-shadow:0 4px 10px -4px rgba(225,29,72,.2)}
.seg{display:flex;gap:4px;background:#f1f5f9;border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:inset 0 1px 3px rgba(15,23,42,.08)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13px;color:var(--mute);cursor:pointer;transition:background .2s,color .2s,transform .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--theme-btn-bg);color:#fff;box-shadow:0 6px 14px -6px rgba(var(--theme-btn-rgb),.7),inset 0 -2px 0 rgba(0,0,0,.12)}
.seg button.on.v-lost{background:linear-gradient(135deg,#e11d48,#be123c);box-shadow:0 6px 14px -6px rgba(225,29,72,.7),inset 0 -2px 0 rgba(0,0,0,.12)}
.seg button.on.v-found{background:linear-gradient(135deg,#059669,#047857);box-shadow:0 6px 14px -6px rgba(5,150,105,.7),inset 0 -2px 0 rgba(0,0,0,.12)}

/* Rainbow theme ("Others"): animated gradient on action buttons and border accents, white text with a soft shadow */
[data-theme=rainbow] .btn:not(.alt):not(.bad),[data-theme=rainbow] .seg button.on:not(.v-lost):not(.v-found){background:var(--theme-gradient);background-size:300% 100%;animation:slide 6s linear infinite;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
[data-theme=rainbow] header::after,[data-theme=rainbow] .card.nf::before,[data-theme=rainbow] nav button.on::before{animation:slide 6s linear infinite}
[data-theme=rainbow] .uni{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--theme-gradient) border-box;background-size:100% 100%,300% 100%;animation:glow 4.5s ease-in-out infinite,slide 6s linear infinite}
[data-theme=rainbow] .av{background:var(--theme-gradient);background-size:300% 100%;text-shadow:0 1px 2px rgba(0,0,0,.45)}
@keyframes slide{to{background-position-x:300%}}

/* Content bits */
.ring{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--theme-btn),var(--theme-secondary) calc(var(--p)*1%),#e2e8f0 0)}
.ring i{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;font-style:normal;box-shadow:inset 0 1px 3px rgba(15,23,42,.1)}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;background:linear-gradient(135deg,#fff,rgba(var(--theme-btn-rgb),.09));border:1px solid var(--line);box-shadow:0 3px 8px -3px rgba(15,23,42,.15)}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 6px}
.bars div{font-size:10.5px;color:var(--mute);text-align:center;font-weight:700}
.bars u{display:block;height:7px;border-radius:4px;background:#e2e8f0;margin-bottom:4px;overflow:hidden}
.bars u b{display:block;height:100%;width:0;animation:grow .9s .3s cubic-bezier(.2,1,.4,1) forwards}
@keyframes grow{to{width:var(--w)}}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(var(--theme-btn-rgb),.1);color:var(--theme-btn);border:1px solid rgba(var(--theme-btn-rgb),.25)}
.tag.lost,.tag.bad{background:#ffe4e6;color:#be123c;border-color:#fecdd3}
.tag.found,.tag.ok{background:#d1fae5;color:#047857;border-color:#a7f3d0}
.tag.amber{background:#fef3c7;color:#92400e;border-color:#fde68a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats div{border-radius:16px;padding:11px;text-align:center;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-1)}
.stats div:nth-child(1) b{color:var(--theme-btn)}.stats div:nth-child(2) b{color:#b45309}.stats div:nth-child(3) b{color:#047857}
.stats b{display:block;font-size:24px;font-weight:800}.stats span{font-size:12px;font-weight:700;color:var(--mute)}
.auth{margin:auto;padding:22px;width:100%}
.auth h1{font-size:30px;margin:0 0 4px;font-weight:800;letter-spacing:-.02em;background:var(--theme-title);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme=rainbow] .auth h1{animation:slide 6s linear infinite}
.err{color:#be123c;font-size:13px;font-weight:700;margin-top:8px;min-height:18px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.sheet{width:100%;max-width:440px;max-height:92%;overflow:auto;box-shadow:0 30px 80px -20px rgba(15,23,42,.4),0 8px 20px rgba(15,23,42,.08);animation:sheetIn .35s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.97)}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:20;max-width:90%;box-shadow:0 14px 30px -10px rgba(15,23,42,.5)}
body:has(.modal) #toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 16px)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.proof,.party{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px;word-break:break-word}
.party h4{margin:0 0 4px;font-size:13px;font-weight:800}
.party.lost h4{color:#be123c}.party.found h4{color:#047857}
.pnote{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;margin-top:8px}
.fc{perspective:1000px}.fi{display:grid;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
.fc.flip .fi{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}.face.back{transform:rotateY(180deg)}
.pair{display:flex;gap:8px}.pair select{width:92px;flex:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}

/* Desktop layout */
@media (min-width:820px){
 #app{max-width:1180px}
 header{padding:14px 28px 16px}.who b{font-size:17px}.av{width:46px;height:46px}.av.lg{width:72px;height:72px}.av.xl{width:104px;height:104px}.uni{height:52px}.uni img,.uni .mono{height:40px;width:40px}.uni .mono{width:auto;min-width:40px}
 nav{order:1;justify-content:flex-start;gap:6px;padding:8px 28px 0;box-shadow:0 8px 20px -14px rgba(15,23,42,.18)}
 nav button{flex:none;flex-direction:row;gap:8px;padding:11px 18px;font-size:14px;border-radius:12px 12px 0 0}
 nav button.on{background:rgba(var(--theme-btn-rgb),.08)}nav button.on svg{transform:none}
 nav button.on::before{top:auto;bottom:0;left:12%;right:12%;height:3px;border-radius:4px 4px 0 0}
 main{order:2;padding:22px 28px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;align-content:start;align-items:start}
 main>h2,main>h3,main>.seg,main>.stats,main>input,main .empty{grid-column:1/-1}
 main #board{display:contents}
 main .tilt{margin-bottom:0}
 main>.seg,main>input{max-width:520px}main>.stats{max-width:720px}
 main[data-tab=report],main[data-tab=profile]{display:block;max-width:640px;width:100%;margin:0 auto}
 main[data-tab=report] .tilt,main[data-tab=profile] .tilt{margin-bottom:14px}

function compressAvatar(file){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const S=256,s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=S;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,S,S);URL.revokeObjectURL(u);
  const d=c.toDataURL('image/jpeg',.8);c.toBlob(b=>res(b?{blob:b,dataUrl:d}:null),'image/jpeg',.8)};
 im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u})}
async function pickAvatar(inp){const f=inp.files[0];if(!f)return;const r=await compressAvatar(f);
 if(!r){inp.value='';return setErr('That image could not be read. Try a JPG or PNG.')}
 setErr('');avBlob=r.blob;avData=r.dataUrl;$('#avPrev').innerHTML=avatarHtml($('#pn')?$('#pn').value:me&&me.name,avData,'lg')}
// Spark plan: no Cloud Storage. The small (~15-25 KB) square JPEG is stored on the user's own profile document.
async function uploadAvatar(uid){return avBlob?avData:''}

 if(!studentId)return setErr('Enter your student ID.');
 if(phone.replace(/\D/g,'').length<6)return setErr('Enter a valid mobile number.');
 if(uni.err)return setErr(uni.err);
 const oldScope=me.scope,up={name,studentId,dept,phone,university:uni.university,campus:uni.campus,universityName:uni.universityName,scope:scopeOf(uni.university,uni.campus,uni.universityName)},b=$('#sv');b.disabled=true;
 try{if(avBlob){const url=await uploadAvatar(cur.uid);if(url)up.photoURL=url}

 catch(e){setErr(friendly(e));b.disabled=false}
}

function compressImage(file,max=1280,qual=.8){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('compress')),'image/jpeg',qual)};
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('That image could not be read. Use a JPG, PNG or WebP photo.'))};im.src=u})}
const blobToDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('read'));r.readAsDataURL(b)});
// Reads the first bytes so the real file type is checked, not just the extension the browser reports.
async function sniff(file){const b=new Uint8Array(await file.slice(0,12).arrayBuffer()),h=Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');
 if(h.startsWith('ffd8ff'))return 'image/jpeg';if(h.startsWith('89504e47'))return 'image/png';if(h.startsWith('25504446'))return 'application/pdf';if(h.startsWith('52494646')&&h.slice(16,24)==='57454250')return 'image/webp';return ''}
// Spark plan: photos and proof files live in Firestore as small base64 data URLs. Report photos are shrunk to <= PHOTO_CAP characters
// (about 45 KB) so the feed stays light; proof files go to their own private documents (<= EV_CAP characters, about 500 KB).
const PHOTO_CAP=60000,EV_CAP=700000,EV_PDF_MAX=480*1024;
async function shrinkImage(file,steps,cap){let du='';for(const [m,q] of steps){du=await blobToDataUrl(await compressImage(file,m,q));if(du.length<=cap)return du}return ''}

function staffView(){
 const m=metrics(),head=`<div class="stats"><div><b>${m.awaiting}</b><span>In inventory</span></div><div><b>${m.pending}</b><span>Pending claims</span></div><div><b>${m.returned}</b><span>Returned</span></div></div>
<div class="seg" role="tablist">${[['stats','Overview'],['claims','Claims'],['inv','Live items'],['ret','Returned'],['audit','Audit']].map(x=>`<button role="tab" aria-selected="${stf===x[0]}" class="${stf===x[0]?'on':''}" onclick="stf='${x[0]}';paint();if(stf==='audit'&&auditRows===null)loadAudit()">${x[1]}</button>`).join('')}</div>`;
 if(rErr)return head+`<div class="card empty rv"><p>${esc(rErr)}</p></div>`;if(!rLoaded)return head+skel(3);
 if(stf==='stats'){const mx=m.top.length?m.top[0][1]:1;
  return head+`<div class="metrics"><div><b>${m.total}</b><span>Total reports</span></div><div><b>${m.openLost}</b><span>Open lost reports</span></div><div><b>${m.awaiting}</b><span>Found items awaiting collection</span></div><div><b>${m.pending}</b><span>Pending claims</span></div><div><b>${m.returned}</b><span>Items returned</span></div><div><b>${m.avg==null?'-':fmtDur(m.avg)}</b><span>Avg. time to return${m.avgN?' ('+m.avgN+' returns)':''}</span></div></div>
<div class="card rv"><b>Most reported categories</b><div class="man"><div class="sc">${m.top.length?m.top.map(([k,v])=>`<div class="r"><span>${esc(k)}</span><div class="b"><i style="width:${Math.round(100*v/mx)}%"></i></div><span class="n">${v}</span></div>`).join(''):'<div class="mute">No reports yet.</div>'}</div></div></div>
<div class="mute" style="font-size:12px">Calculated from the latest ${reports.length} reports and ${claims.length} claims loaded for your university. Average return time needs claims that have both timestamps (v23 claims only).</div>`}
 if(stf==='audit')return head+(auditErr?`<div class="card empty rv"><p>${esc(auditErr)}</p></div>`:auditRows===null?skel(2):`<button class="btn sm alt" onclick="loadAudit()">Refresh</button>`+(auditRows.length?auditRows.map(a=>`<div class="card tilt rv"><b>${esc(a.action)}</b> <span class="mute">by ${esc(a.byName||a.by)} · ${esc(fmtFull(a.at))}</span><div class="mute">${esc(a.targetType)} ${esc(a.targetId)}</div><div>${esc(a.detail||'')}</div></div>`).join(''):emptyCard('No audited actions yet.')));
 if(stf==='inv'){const l=itemsFiltered();return head+staffFilters(false)+(l.length?l.map(r=>`<div class="card tilt rv row" data-id="${r.id}">${ico(r)}<div class="grow" role="button" tabindex="0" onclick="openView('${r.id}')"><b>${esc(itemLine(r))}</b><div class="mute">${esc(locLine(r))} · ${esc(r.date)}</div><div class="mute">${esc(r.name)}</div><span class="tag ${r.type==='lost'?'lost':'found'}">${r.type}</span>${r.status!=='open'?` <span class="tag">${statusTxt(r)}</span>`:''}</div><button class="btn sm bad" onclick="removeReport('${r.id}')">Remove</button></div>`).join(''):emptyCard('No live items match.'))}
 const list=claimsFiltered();ensureExtra(claims.flatMap(c=>[c.foundId,c.lostId]));
 return head+staffFilters(true)+(list.length?list.map(staffClaimCard).join(''):emptyCard(stf==='ret'?'No returned items yet.':'No claims match.'))}

// ---------- Pinky AI chatbot (bottom-right) ----------
let pOpen=false,pBusy=false,pMsgs=[];
const SRC={app:'From the app help',acct:'From your account (verified)',ai:'AI suggestion - not verified. Check with campus staff for anything important.'};
const FAQ=[
 [/status|where.*(claim|report)|my (claim|report)|track|progress/,'status'],
 [/lost|missing|misplace|can'?t find|report.*(lost|item)/,"To report a lost item: tap I Lost Something on Home (or Report > I lost something), say what it is, where and when you lost it, and add a photo if you have one. We then look for found items that may match and notify you."],
 [/found|picked up|handed in|report.*found/,"To report a found item: tap I Found Something, add a clear photo and where you found it. Do not post serial numbers - there is a private box for details only you and staff can see. For valuables, hand them to campus staff."],
 [/claim|prove|proof|evidence|ownership|belongs/,"To claim an item: open the possible match (Matches tab), compare the two reports, tap This is mine and describe a unique mark or serial number. You can attach a photo, receipt or a small PDF (up to 480 KB; photos are shrunk automatically). Staff review it - a high match score alone never approves a claim."],
 [/collect|pick ?up|meet|hand ?over|safe/,"To collect safely: wait for the Approved status, then meet in a public campus place in daylight or at the staff desk, bring your student ID, and let staff confirm the handover. Never pay anyone or share passwords or OTPs."],
 [/notif|alert|bell|unread/,"The bell at the top shows your notifications: possible matches, claim updates, requests for more proof and returns. Tap one to open the related report or claim."],
 [/match|score|percent|accura/,"Match scores compare category, colour, brand, description, date and place. They are estimates that help you find candidates - not proof of ownership."],
 [/contact|phone|number|finder/,"Contact details are only shown after staff approve your claim, and only between the claimant and the finder. I can never show anyone else's details."],
 [/password|log ?in|sign ?in|otp|account/,"Use Settings in your Profile to change your password, or Forgot password on the sign-in screen. I will never ask for your password or OTP."]];
const QUICK=['Report a lost item','Report a found item','How do claims work?','Track my claim','Collect safely'];
function myStatusAnswer(){const mc=myClaimsSorted().slice(0,3),mr=reports.filter(r=>r.uid===cur.uid&&r.status!=='returned').slice(0,3);if(!mc.length&&!mr.length)return 'You have no active reports or claims yet.';
 return [...mc.map(c=>'Claim for '+itemName(fr(c.foundId))+': '+(CLAIM_LABEL[c.status]||c.status)+(isPend(c)||c.status==='approved'?' - '+nextHint(c):'')),...mr.map(r=>'Your '+r.type+' report ('+itemName(r)+'): '+(r.status==='held'?'a claim is pending':r.status))].join('\n')}
function pinkyLocal(t){const s=t.toLowerCase();for(const [re,a] of FAQ)if(re.test(s))return a==='status'?{t:myStatusAnswer(),src:SRC.acct}:{t:a,src:SRC.app};return null}
const pinkyGreeting=()=>'Hi '+((me&&me.name||'there').split(' ')[0])+'! 👋 I\'m Pinky AI, your campus Lost & Found buddy. Ask me how to report an item, how claims work, or where your claim is. 💖';
function pinkyMount(){let w=document.getElementById('pinky');
 if(!cur||!me){if(w)w.remove();const o=document.getElementById('pwin');if(o)o.remove();pMsgs=[];pOpen=false;return}
 if(w)return;w=document.createElement('div');w.id='pinky';w.innerHTML='<button class="pfab" aria-label="Open Pinky AI chat" onclick="pinkyToggle()">🤖</button>';document.body.appendChild(w);
 const win=document.createElement('div');win.id='pwin';win.className='pwin';win.setAttribute('role','dialog');win.setAttribute('aria-label','Pinky AI chat');
 win.innerHTML='<div class="phead"><span style="font-size:22px">🤖</span><b>Pinky AI</b><button aria-label="Close chat" onclick="pinkyToggle()">✕</button></div><div class="pmsgs" id="pmsgs" aria-live="polite"></div><form class="pform" onsubmit="return pinkySend(event)"><input id="pin" autocomplete="off" maxlength="400" placeholder="Ask Pinky anything…" aria-label="Message Pinky AI"><button id="psend" type="submit">Send</button></form>';document.body.appendChild(win)}
function pinkyToggle(){pOpen=!pOpen;const w=document.getElementById('pwin');if(!w)return;w.classList.toggle('open',pOpen);if(pOpen){if(!pMsgs.length)pMsgs.push({r:'bot',t:pinkyGreeting(),chips:1});pinkyDraw();const i=document.getElementById('pin');if(i)setTimeout(()=>i.focus(),50)}}
function pinkyDraw(typing){const b=document.getElementById('pmsgs');if(!b)return;
 b.innerHTML=pMsgs.map(m=>`<div class="pm ${m.r==='me'?'me':'bot'}">${esc(m.t)}${m.src?`<span class="src">${esc(m.src)}</span>`:''}</div>`).join('')+(typing?'<div class="pm bot" aria-label="Pinky is typing"><span class="ptyp"><i></i><i></i><i></i></span></div>':'')+(pMsgs.length&&pMsgs[pMsgs.length-1].chips&&!typing?`<div class="chips">${QUICK.map(x=>`<button onclick="pinkyAsk(this.textContent)">${x}</button>`).join('')}</div>`:'');b.scrollTop=b.scrollHeight}
function pinkyAsk(t){const i=document.getElementById('pin');if(i){i.value=t;pinkySend({preventDefault(){}})}}
async function pinkySend(ev){ev.preventDefault();if(pBusy)return false;const i=document.getElementById('pin'),t=i.value.trim();if(!t)return false;
 i.value='';pMsgs.forEach(m=>delete m.chips);pMsgs.push({r:'me',t});pBusy=true;document.getElementById('psend').disabled=true;pinkyDraw(true);
 const loc=pinkyLocal(t);
 try{if(loc){await new Promise(r=>setTimeout(r,250));pMsgs.push({r:'bot',t:loc.t,src:loc.src})}
  else{const hist=pMsgs.slice(-7,-1).map(m=>({r:m.r,t:m.t})),res=await aiPinky(t,hist);pMsgs.push({r:'bot',t:String(res.text||'').slice(0,800),src:SRC.ai})}}
 catch(e){console.warn('Pinky AI unavailable:',e&&e.code);pMsgs.push({r:'bot',t:/resource-exhausted/.test((e&&e.code)||'')?'You are asking very fast - give me a minute. 😅 Meanwhile, pick a topic:':(e&&e.code==='ai-off')?'My AI brain is switched off in this app, but I can still help with the basics. Pick a topic:':'My AI brain is not reachable right now, but I can still help with the basics. Pick a topic:',chips:1})}
 pinkyDraw();pBusy=false;const sb=document.getElementById('psend');if(sb)sb.disabled=false;const ii=document.getElementById('pin');if(ii)ii.focus();return false}

// ---------- Shell ----------
function paint(all=true){
 const m=$('main');if(!m)return;const top=m.scrollTop,ae=document.activeElement,keep=ae&&['q','sq'].includes(ae.id)&&m.contains(ae)?{id:ae.id,s:ae.selectionStart}:null;if(all)seen.clear();
 m.innerHTML=isAdmin()&&tab==='staff'?staffView():tab==='home'?homeView():tab==='matches'?matchesView():tab==='report'?reportView():tab==='alerts'?alertsView():tab==='profile'?profileView():feedView();
 m.dataset.tab=tab;m.scrollTop=top;setTimeout(()=>reveal(m,all),all?250:0);
 if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.s)}catch(_){}}}}
const go=t=>{tab=t;pmode='view';q='';fOpen=false;avBlob=null;avData='';if(modal){modal=null}render();const m=$('main');if(m)m.scrollTop=0;if(t==='report'&&rdraft&&rtype)setTimeout(()=>{},0)};
function render(){
 const app=$('#app');document.body.classList.toggle('authpage',!cur||!me);
 if(!cur||!me){applyTheme('');app.innerHTML=authView();pinkyMount();return}
 applyTheme(me.university);
 const tabs=[['home','Home'],['feed','Feed'],['matches','Matches'],['report','Report'],['profile','Profile']];if(isAdmin())tabs.unshift(['staff','Staff']);
 app.innerHTML=`<header><button class="who" onclick="go('profile')" aria-label="Open my profile">${avatarHtml(me.name,me.photoURL)}<div><b>Hi, ${esc(me.name.split(' ')[0])}</b><small>${isAdmin()?'Staff':'ID '+esc(me.studentId)}</small></div></button>
<button class="bell" id="bell" onclick="go('alerts')" aria-label="Notifications">${svg('bell')}<span class="badge" id="bellN" aria-hidden="true"></span></button>${uniLogoHtml(me.university,me.campus)}</header><main></main>
<nav aria-label="Main">${tabs.map(t=>`<button class="${t[0]===tab?'on':''}" ${t[0]===tab?'aria-current="page"':''} onclick="go('${t[0]}')">${svg(t[0])}${t[1]}</button>`).join('')}</nav><div id="mroot"></div>`;
 paint(!modal);bell();drawModal();pinkyMount();setOnline(navigator.onLine!==false)}
render();
</script>
